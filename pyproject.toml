[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-android-repair"
version = "0.1.0"
description = "Universal Android Repair & ROM Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.15.0",
]

[project.scripts]
universal-android-repair = "universal_android_repair.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
